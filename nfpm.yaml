# ==============================================================================
# nFPM Build Configuration — telemt-bot
# Sidecar Telegram bot for telemt MTProxy management on OpenWrt.
# Reads UCI config from /etc/config/telemt (shared with luci-app-telemt).
# Creates minimal UCI skeleton on install if luci-app-telemt is absent (headless).
# ==============================================================================
name: "telemt-bot"
platform: "linux"
version: "3.3.31"
section: "net"
maintainer: "Medvedolog <Medvedolog@github.com>"
homepage: "https://github.com/Medvedolog/telemt-bot"
description: |
  Autonomous Telegram bot for managing telemt MTProxy on OpenWrt routers.
  Features: 4-tier failover (SOCKS->Direct->Emergency IP->Opera), health-check daemon,
  user/upstream CRUD via inline keyboards, UCI-native config, procd service.
  Works standalone (headless) or alongside luci-app-telemt (shared UCI config).
  Postinst creates /etc/config/telemt skeleton if missing.

depends:
  - libc
  - jsonfilter
  - ca-bundle
  - uclient-fetch

# curl is recommended for SOCKS proxy, Opera Proxy and Emergency IP failover.
# Without curl, Tier 1 (SOCKS), Tier 3 (--resolve) and Tier 4 are unavailable.
recommends:
  - curl

conflicts:
  []

contents:
  - src: ./usr/bin/telemt-bot
    dst: /usr/bin/telemt-bot
    file_info:
      mode: 0755

  - src: ./etc/init.d/telemt-bot
    dst: /etc/init.d/telemt-bot
    file_info:
      mode: 0755

scripts:
  postinstall: ./scripts/postinst
  preremove: ./scripts/prerm
  postremove: ./scripts/postrm

apk:
  arch: "noarch"

ipk:
  arch: "all"
